name: STORM R Android validation
on:
  push:
    paths: ['r2/**/*.java', 'r2/**/*.py', 'r2/assets/*', 'r2/native/**', 'r2/tests/android/AndroidManifest.xml', 'r1/**/*.py', 'r1/**/*.c', 'r1/**/*.smali', 'r1/**/*.json', 'r1/tests/android/AndroidManifest.xml', '.github/workflows/android.yml']
  workflow_dispatch:
concurrency:
  group: r2-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-11:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        font: ['1.0', '1.3']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official Android test/build packages
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'build-tools;35.0.0' 'platforms;android-30' 'system-images;android-30;google_apis;x86_64'
          mkdir -p "$RUNNER_TEMP/r1-tools" "$RUNNER_TEMP/r1-results"
          curl -fLsS -o "$RUNNER_TEMP/r1-tools/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/r1-tools/apktool.jar" | sha256sum -c -
          curl -fLsS -o "$RUNNER_TEMP/r1-tools/upstream.apk" https://github.com/Masterllgod/naruto-storm-revolution-port-nativo/releases/download/v1.1.11/NarutoStormRevolution-PortNativo-v1.1.11-arm64.apk
          echo "38f2435a5dd517da1acbe133615eeb9a021857daf4923d9c996d1bd76b94b567  $RUNNER_TEMP/r1-tools/upstream.apk" | sha256sum -c -
      - name: Build source with an ephemeral CI test key
        run: |
          set -euo pipefail
          printf 'android\n' > "$RUNNER_TEMP/r1-tools/test.pass"
          keytool -genkeypair -alias xhyn-r1 -keyalg RSA -keysize 2048 -validity 2 -storetype PKCS12 -keystore "$RUNNER_TEMP/r1-tools/test.p12" -storepass:file "$RUNNER_TEMP/r1-tools/test.pass" -dname 'CN=XHYN_PH CI Test Only'
          python3 r2/preflight.py --android-jar "$ANDROID_HOME/platforms/android-30/android.jar" --upstream "$RUNNER_TEMP/r1-tools/upstream.apk" --apktool "$RUNNER_TEMP/r1-tools/apktool.jar" --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          python3 r1/build_r1.py --r2 --android-jar "$ANDROID_HOME/platforms/android-30/android.jar" --upstream "$RUNNER_TEMP/r1-tools/upstream.apk" --apktool "$RUNNER_TEMP/r1-tools/apktool.jar" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --build-tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$RUNNER_TEMP/r1-tools/test.p12" --password-file "$RUNNER_TEMP/r1-tools/test.pass" --output "$RUNNER_TEMP/r1-results/R2-ci-only.apk"
          python3 r2/tests/android/build_tests.py --android-jar "$ANDROID_HOME/platforms/android-30/android.jar" --build-tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$RUNNER_TEMP/r1-tools/test.p12" --password-file "$RUNNER_TEMP/r1-tools/test.pass" --output "$RUNNER_TEMP/r1-tools/R2-tests.apk"
      - name: Start hardware-accelerated Android 11 with ARM translation
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/r1-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name R1_API30 --path "$ANDROID_AVD_HOME/R1_API30.avd" --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/R1_API30.avd" > "$ANDROID_AVD_HOME/R1_API30.ini"
          "$ANDROID_HOME/emulator/emulator" -avd R1_API30 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 3072 -no-metrics > "$RUNNER_TEMP/r1-results/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            ready=$(timeout 5 "$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$ready" = 1 ]; then booted=true; break; fi
            sleep 3
          done
          if [ "$booted" != true ]; then
            python3 - <<'PYBOOT'
          from pathlib import Path
          import os
          text=(Path(os.environ['RUNNER_TEMP'])/'r1-results/emulator.log').read_text(errors='replace')[-3500:]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=Android emulator failed to boot::'+text)
          PYBOOT
            exit 1
          fi
          abis=$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.product.cpu.abilist | tr -d '\r')
          echo "::notice title=Android test ABIs::$abis"
      - name: Test the R2 Android interface and native logging integration
        timeout-minutes: 13
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/r1-results/android-command-log.txt") 2>&1
          report_failure() {
            result=$?
            timeout --kill-after=5 15 "$ANDROID_HOME/platform-tools/adb" logcat -d -b crash -t 100 > "$RUNNER_TEMP/r1-results/android-crashes.txt" || true
            python3 - <<'PYDIAG'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'r1-results'
          for name in ['android-instrumentation.txt','android-crashes.txt','android-command-log.txt']:
              path=root/name
              if not path.exists(): continue
              text=path.read_text(errors='replace')[-3400:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Android failure '+name+'::'+text)
          PYDIAG
            return "$result"
          }
          trap report_failure ERR
          timeout --kill-after=10 90 "$ANDROID_HOME/platform-tools/adb" install --no-incremental -r "$RUNNER_TEMP/r1-results/R2-ci-only.apk"
          timeout --kill-after=10 90 "$ANDROID_HOME/platform-tools/adb" install --no-incremental -t -r "$RUNNER_TEMP/r1-tools/R2-tests.apk"
          "$ANDROID_HOME/platform-tools/adb" shell settings put system font_scale "${{ matrix.font }}"
          "$ANDROID_HOME/platform-tools/adb" logcat -c
          timeout --kill-after=10 600 "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -r com.naruto.storm4.r2tests/com.naruto.r2tests.R2Instrumentation | tee "$RUNNER_TEMP/r1-results/android-instrumentation.txt"
          timeout --kill-after=5 30 "$ANDROID_HOME/platform-tools/adb" root
          timeout --kill-after=5 30 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for name in launcher controller display game-menu statistics closing touch-stock touch-cached; do
            timeout --kill-after=5 30 "$ANDROID_HOME/platform-tools/adb" pull "/sdcard/Android/data/com.naruto.storm4/files/r2-tests-$name.png" "$RUNNER_TEMP/r1-results/$name.png" || true
            timeout --kill-after=5 30 "$ANDROID_HOME/platform-tools/adb" pull "/sdcard/Android/data/com.naruto.storm4/files/r2-tests-$name.preview.jpg" "$RUNNER_TEMP/r1-results/$name.preview.jpg" || true
          done
          "$ANDROID_HOME/platform-tools/adb" logcat -d -s R1_NATIVE_TEST:I System.err:W > "$RUNNER_TEMP/r1-results/logging-markers.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'r1-results'
          result=(root/'android-instrumentation.txt').read_text()
          if 'R2_ANDROID_RESULT=PASS' not in result:
              message=result[-3500:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=R1 Android test failure::'+message)
              raise SystemExit(1)
          assert 'R2_ANDROID_RESULT=FAIL' not in result, result
          markers=(root/'logging-markers.txt').read_text()
          for kind in ('LOGGING', 'STACK', 'STDERR'):
              assert 'R1_'+kind+'_ON_MARKER' in markers, markers
              assert 'R1_'+kind+'_OFF_MARKER' not in markers, markers
          print('PASS: Android instrumentation and real app logcat On/Off markers')
          import re
          print('::notice title=R2 Android result::'+re.search(r'R2_ANDROID_RESULT=PASS assertions=\d+',result).group())
          PY
      - name: Exercise the real game activity up to the missing-game-file boundary
        run: python3 r2/tests/android/startup_smoke.py
      - name: Preview launcher screen
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'r1-results/launcher.preview.jpg'
          if path.exists():
              encoded=base64.b64encode(path.read_bytes()).decode()
              parts=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for index,part in enumerate(parts,1):print(f'::notice title=R2 preview launcher {index:02d}/{len(parts):02d}::'+part)
          PY
      - name: Preview controller screen
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'r1-results/controller.preview.jpg'
          if path.exists():
              encoded=base64.b64encode(path.read_bytes()).decode()
              parts=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for index,part in enumerate(parts,1):print(f'::notice title=R2 preview controller {index:02d}/{len(parts):02d}::'+part)
          PY
      - name: Preview display screen
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'r1-results/display.preview.jpg'
          if path.exists():
              encoded=base64.b64encode(path.read_bytes()).decode()
              parts=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for index,part in enumerate(parts,1):print(f'::notice title=R2 preview display {index:02d}/{len(parts):02d}::'+part)
          PY
      - name: Preview game-menu screen
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'r1-results/game-menu.preview.jpg'
          if path.exists():
              encoded=base64.b64encode(path.read_bytes()).decode()
              parts=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for index,part in enumerate(parts,1):print(f'::notice title=R2 preview game-menu {index:02d}/{len(parts):02d}::'+part)
          PY
      - name: Preview statistics screen
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'r1-results/statistics.preview.jpg'
          if path.exists():
              encoded=base64.b64encode(path.read_bytes()).decode()
              parts=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for index,part in enumerate(parts,1):print(f'::notice title=R2 preview statistics {index:02d}/{len(parts):02d}::'+part)
          PY
      - name: Preview closing screen
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'r1-results/closing.preview.jpg'
          if path.exists():
              encoded=base64.b64encode(path.read_bytes()).decode()
              parts=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for index,part in enumerate(parts,1):print(f'::notice title=R2 preview closing {index:02d}/{len(parts):02d}::'+part)
          PY
      - name: Preview failed touch comparison
        if: failure()
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          for name in ['touch-stock','touch-cached']:
              path=Path(os.environ['RUNNER_TEMP'])/'r1-results'/(name+'.preview.jpg')
              if not path.exists(): continue
              encoded=base64.b64encode(path.read_bytes()).decode()
              parts=[encoded[i:i+4000] for i in range(0,len(encoded),4000)]
              for index,part in enumerate(parts,1):print(f'::notice title=R2 preview {name} {index:02d}/{len(parts):02d}::'+part)
          PY
      - name: Retain validation reports, not the temporary signing key/APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R2-Android-validation-${{ matrix.font }}
          path: |
            ${{ runner.temp }}/r1-results/*.txt
            ${{ runner.temp }}/r1-results/*.png
            ${{ runner.temp }}/r1-results/*.jpg
            ${{ runner.temp }}/r1-results/*.json
            ${{ runner.temp }}/r1-results/*.log
          if-no-files-found: ignore
